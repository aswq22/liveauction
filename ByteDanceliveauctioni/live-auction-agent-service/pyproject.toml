[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "live-auction-agent-service"
version = "0.1.0"
description = "Live auction agent runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
    "grpcio==1.83.0",
    "grpcio-tools==1.83.0",
    "langgraph==1.2.11",
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg[binary,pool]==3.3.4",
    "pydantic==2.13.4",
    "openai==3.3.1",
    "opentelemetry-sdk==1.44.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
markers = [
    "postgres: requires AGENT_TEST_POSTGRES_DSN and a disposable PostgreSQL database",
]
