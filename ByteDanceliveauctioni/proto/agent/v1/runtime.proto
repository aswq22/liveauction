syntax = "proto3";

package agent.v1;

option go_package = "live-auction-bid/backend/api/agent/v1;agentv1";

import "proto/agent/v1/common.proto";

service AgentRuntimeService {
  rpc StartRun(StartRunRequest) returns (StartRunReply);
  rpc GetRun(GetRunRequest) returns (GetRunReply);
  rpc CancelRun(CancelRunRequest) returns (CancelRunReply);
  rpc StreamRunEvents(StreamRunEventsRequest) returns (stream AgentRunEvent);
}

message StartRunRequest {
  // Generated by Go before calling the runtime. The runtime must not replace it.
  string run_id = 1;
  RequestContext context = 2;
  // Retained for old callers that start a one-off read-only planning run.
  string goal = 3;
  RunType run_type = 4;
  string session_id = 5;
  int64 session_version = 6;
  string turn_input_json = 7;
}

message StartRunReply {
  AgentRun run = 1;
}

message GetRunRequest {
  RequestContext context = 1;
  string run_id = 2;
}

message GetRunReply {
  AgentRun run = 1;
}

message CancelRunRequest {
  RequestContext context = 1;
  string run_id = 2;
}

message CancelRunReply {
  AgentRun run = 1;
}

message StreamRunEventsRequest {
  RequestContext context = 1;
  string run_id = 2;
  int64 after_seq = 3;
}

message AgentRun {
  string run_id = 1;
  string goal = 2;
  RunStatus status = 3;
  string proposal_json = 4;
  string error_code = 5;
  string error_message = 6;
  int64 created_at_unix_ms = 7;
  int64 updated_at_unix_ms = 8;
  RunType run_type = 9;
  string session_id = 10;
  int64 session_version = 11;
  string turn_result_json = 12;
}

message AgentRunEvent {
  string run_id = 1;
  int64 seq = 2;
  string type = 3;
  RunStatus status = 4;
  string payload_json = 5;
  int64 created_at_unix_ms = 6;
}
